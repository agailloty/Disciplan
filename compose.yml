services:
  disciplaner:
    # Single container serving both the REST API (for the web, mobile and
    # desktop clients) and the Flutter web front from the same origin.
    # No PostgreSQL service is configured in this compose file: if DATABASE_URL
    # and ConnectionStrings__Postgres are omitted, the API automatically falls
    # back to a local SQLite database persisted in /data/disciplaner.db.
    # For a dedicated PostgreSQL container, use compose.postgres.yml instead.
    build: .
    image: disciplaner:local
    # image: ghcr.io/agailloty/disciplan:latest
    restart: unless-stopped
    ports:
      - "${DISCIPLAN_PORT:-8080}:8080"
    volumes:
      - disciplaner-data:/data
    environment:
      Jwt__SecretKey: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env (min. 32 characters)}"
      Jwt__Issuer: "${JWT_ISSUER:-Disciplaner}"
      Jwt__Audience: "${JWT_AUDIENCE:-Disciplaner}"
      # Optional: seed the first admin account on startup.
      # If omitted, the app opens the /setup wizard on first run.
      AdminSeed__Email: "${ADMIN_EMAIL:-}"
      AdminSeed__Password: "${ADMIN_PASSWORD:-}"
      # Optional: connect to an external / Cloud managed PostgreSQL database
      # (e.g. Neon, Supabase, AWS RDS, Azure, Scaleway). Leave empty to fallback to SQLite.
      DATABASE_URL: "${DATABASE_URL:-}"
      ConnectionStrings__Postgres: "${POSTGRES_CONNECTION_STRING:-}"
      # Uncomment if a reverse proxy terminates TLS upstream
      # ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"

volumes:
  disciplaner-data:
