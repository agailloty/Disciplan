<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disciplaner</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Disciplaner.Web.Client.styles.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Helvetica', 'Arial', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            html, body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f6f8fa; color: #1f2328; }
            a { color: inherit; text-decoration: none; }
            * { box-sizing: border-box; }
        }
        @layer components {
            /* ── Buttons ───────────────────────────────────────────────────── */
            .btn       { @apply inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium rounded-md border transition-colors duration-150 cursor-pointer select-none disabled:opacity-50 disabled:cursor-not-allowed; }
            .btn-primary  { @apply bg-gray-900 text-white border-gray-900 hover:bg-gray-700 hover:border-gray-700; }
            .btn-secondary { @apply bg-white text-gray-700 border-gray-300 hover:bg-gray-50; }
            .btn-danger   { @apply bg-red-600 text-white border-red-600 hover:bg-red-700 hover:border-red-700; }
            .btn-ghost    { @apply bg-transparent text-gray-600 border-transparent hover:bg-gray-100 hover:border-gray-100; }
            .btn-outline  { @apply bg-white text-gray-600 border-gray-300 hover:bg-gray-50; }
            .btn-sm       { @apply px-2 py-1 text-xs; }
            .btn-lg       { @apply px-4 py-2 text-base; }
            .btn-full     { @apply w-full justify-center; }
            /* ── Forms ─────────────────────────────────────────────────────── */
            .form-input   { @apply w-full px-3 py-1.5 text-sm border border-gray-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-offset-0 focus:ring-blue-500 focus:border-blue-500 placeholder:text-gray-400; }
            .form-textarea { @apply w-full px-3 py-2 text-sm border border-gray-300 rounded-md bg-white resize-none focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 placeholder:text-gray-400; }
            .form-select  { @apply w-full px-3 py-1.5 text-sm border border-gray-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 cursor-pointer; }
            .form-label   { @apply block text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wide; }
            /* ── Badges ────────────────────────────────────────────────────── */
            .badge        { @apply inline-flex items-center px-2 py-0.5 text-xs font-medium rounded-full; }
            .badge-dark   { @apply bg-gray-900 text-white; }
            .badge-gray   { @apply bg-gray-100 text-gray-700; }
            .badge-prio-low      { @apply bg-gray-100 text-gray-600; }
            .badge-prio-medium   { @apply bg-blue-100 text-blue-700; }
            .badge-prio-high     { @apply bg-amber-100 text-amber-700; }
            .badge-prio-critical { @apply bg-red-100 text-red-700; }
            /* ── Cards ─────────────────────────────────────────────────────── */
            .surface { @apply bg-white border border-gray-200 rounded-lg; }
            .surface-hover { @apply transition-shadow duration-150 hover:shadow-md cursor-pointer; }
            /* ── Navigation ────────────────────────────────────────────────── */
            .topnav-link { @apply text-gray-300 text-sm font-medium px-3 py-1.5 rounded-md transition-colors duration-100 hover:text-white hover:bg-white/10; }
            /* ── Section heading ───────────────────────────────────────────── */
            .page-title { @apply text-xl font-semibold text-gray-900; }
            .section-label { @apply text-xs font-semibold text-gray-400 uppercase tracking-wider; }
        }
    </style>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/kanban.js"></script>
    <script>
        window.blazorCulture = {
            get: () => localStorage.getItem('blazor-culture') || 'fr',
            set: (value) => localStorage.setItem('blazor-culture', value)
        };
    </script>
</body>

</html>
