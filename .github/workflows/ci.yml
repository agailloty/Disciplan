name: Build and test

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Disciplaner.slnx
      - name: Build
        run: dotnet build Disciplaner.slnx --no-restore --configuration Release
      - name: Domain and API tests
        run: dotnet test tests/Disciplaner.Tests/Disciplaner.Tests.csproj --no-build --configuration Release --logger trx --results-directory artifacts/test-results
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter analyze and tests
        working-directory: src/Disciplaner.Flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            artifacts/test-results
