name: Build and test

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Disciplaner.slnx
      - name: Build
        run: dotnet build Disciplaner.slnx --no-restore --configuration Release
      - name: Domain and API tests
        run: dotnet test tests/Disciplaner.Tests/Disciplaner.Tests.csproj --no-build --configuration Release --logger trx --results-directory artifacts/test-results
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/Disciplaner.BrowserTests/package-lock.json
      - name: Install browser test dependencies
        working-directory: tests/Disciplaner.BrowserTests
        run: npm ci
      - name: Install Chromium
        working-directory: tests/Disciplaner.BrowserTests
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: tests/Disciplaner.BrowserTests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            artifacts/test-results
            tests/Disciplaner.BrowserTests/playwright-report
            tests/Disciplaner.BrowserTests/test-results
