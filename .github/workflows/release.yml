name: Build & publish release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Compute release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # PAT (write:packages): the existing package was created with a PAT
          # and is not linked to this repository, so GITHUB_TOKEN has no write
          # access to it (denied: permission_denied: write_package).
          password: ${{ secrets.DISCIPLAN_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          cache: true

      - name: Build APK
        working-directory: src/Disciplaner.Flutter
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "Disciplaner-${VERSION}-android.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: disciplaner-android
          path: src/Disciplaner.Flutter/Disciplaner-*-android.apk
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev zip

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          cache: true

      - name: Build Linux executable
        working-directory: src/Disciplaner.Flutter
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package
        working-directory: src/Disciplaner.Flutter
        run: |
          cd build/linux/x64/release
          zip -r "Disciplaner-${VERSION}-linux-x64.zip" bundle
          mv "Disciplaner-${VERSION}-linux-x64.zip" "${GITHUB_WORKSPACE}/src/Disciplaner.Flutter/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: disciplaner-linux-x64
          path: src/Disciplaner.Flutter/Disciplaner-*-linux-x64.zip
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          cache: true

      - name: Build Windows executable
        working-directory: src/Disciplaner.Flutter
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package
        working-directory: src/Disciplaner.Flutter
        shell: pwsh
        run: |
          Copy-Item -Recurse build/windows/x64/runner/Release staging/Disciplaner-windows-x64
          Compress-Archive -Path staging/Disciplaner-windows-x64 `
            -DestinationPath "Disciplaner-${env:VERSION}-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: disciplaner-windows-x64
          path: src/Disciplaner.Flutter/Disciplaner-*-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          cache: true

      - name: Build macOS executable
        working-directory: src/Disciplaner.Flutter
        run: |
          flutter pub get
          flutter build macos --release

      - name: Package
        working-directory: src/Disciplaner.Flutter
        run: |
          cd build/macos/Build/Products/Release
          # The bundle is named after the Xcode target (Runner.app), not the pubspec name
          APP=$(ls -d *.app | head -n 1)
          ditto -c -k --keepParent "$APP" "Disciplaner-${VERSION}-macos.zip"
          mv "Disciplaner-${VERSION}-macos.zip" "${GITHUB_WORKSPACE}/src/Disciplaner.Flutter/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: disciplaner-macos
          path: src/Disciplaner.Flutter/Disciplaner-*-macos.zip
          if-no-files-found: error

  release:
    name: Attach binaries to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [docker, android, linux, windows, macos]
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
